name: rm-accel
layer: l1-accel
kind: library
summary: GPU·NPU(RNGD, ATOM)·CPU 이종 가속기 통합 추상화 — 장치 탐지, 자원·엔진 플러그인, vLLM 호환 API
maturity: prototype
hardware: [GPU, CPU, RNGD, ATOM]
install:
  - python -m pip install -r requirements/requirements.txt
  - python -m pip install -e .
test:
  - python -m pytest -q -m "not gpu and not slow" tests/unit
  - python -m rm_core.conformance airm.accelerator_providers rm-abstract
deploy:
  target: k8s
  manifests: null
  chart: deploy/helm/rm-abstract-node
  image: ghcr.io/ai-computing/rm-accel
config:
  env_example: null
interfaces:
  provides: [Accelerator]
  uses: []
kpi: [이종자원수]
# protocol v0.1 (ai-rm docs/integration-guide.md section 2.7)
protocol: "0.1"
adapters:
  - group: airm.accelerator_providers
    name: rm-abstract
metrics: [accelerators]
