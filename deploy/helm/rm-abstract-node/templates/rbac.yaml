{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rm-abstract-node.fullname" . }}
  labels:
    {{- include "rm-abstract-node.labels" . | nindent 4 }}
rules:
  - apiGroups: ["airm.ai-computing.io"]
    resources: ["acceleratorprofiles"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rm-abstract-node.fullname" . }}
  labels:
    {{- include "rm-abstract-node.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rm-abstract-node.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rm-abstract-node.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
