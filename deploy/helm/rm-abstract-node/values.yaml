# rm-abstract-node: ai-rm L1 node daemon (python -m rm_abstract.airm.daemon).
# The AcceleratorProfile CRD comes from rm-core (k8s/acceleratorprofile.crd.yaml), installed by
# the ai-rm umbrella chart / llm-d-setup. Site values go in ai-rm deploy/clusters/<name>/ overrides.
enabled: true

image:
  repository: ghcr.io/ai-computing/rm-accel  # Dockerfile: rm-abstract + rm-core + kubernetes, no vendor tools
  tag: ""              # default: chart appVersion (image tags follow the rm-accel release, e.g. 0.4.2)
  pullPolicy: IfNotPresent

airm:
  kvTransport: ""      # unused by this chart (L1 publishes devices only)
  placement: ""        # unused by this chart
  metricsPort: 9400    # airm_accelerators on /metrics; 0 disables

provider: rm-abstract  # entry point name in airm.accelerator_providers ("sim" for a simulated cluster)
intervalSeconds: 60    # seconds between discoveries
removeAfter: 3         # remove a device's profile after this many discoveries without it

# Vendor tools read the device nodes, which needs a privileged container.
privileged: true
# Mount the host's /dev live. A privileged container otherwise sees /dev as it was at start, and a
# device that a driver re-creates (e.g. after a pod releases an ATOM) drops out of discovery.
hostDev: true
# The vendor tools (nvidia-smi, furiosa-smi, rbln-stat) come from the host, matching its driver: this
# host directory is mounted read-only at /host/usr/bin, which is on the image's PATH. "" disables
# (e.g. the sim provider, or an image that carries its own tools).
hostBin: /usr/bin
# Per-card occupancy: which processes hold each card, from furiosa-smi ps / the rbln ctx_info and
# /proc/<pid>/fd, classified by /proc/<pid>/cgroup (pod or host). A card held by a process outside
# Kubernetes is published busy (spec.extra healthy "false"), so rm-controller does not place on it.
occupancy: true
# The host's PID namespace, needed to see those processes. With hostPID false the daemon reports no
# occupancy at all (never "free" for a card it cannot see).
hostPID: true

serviceAccount:
  create: true
  name: ""

# Site extension points (all empty by default): the published image needs none of them. A site
# with its own image or packages can still add an init container, env, volumes and mounts.
command: []            # default: python -m rm_abstract.airm.daemon
extraEnv: []           # [{name, value}] appended to the daemon's env
initContainers: []     # pod initContainers, verbatim
extraVolumes: []       # pod volumes, verbatim
extraVolumeMounts: []  # daemon volumeMounts, verbatim

nodeAffinity: {}       # default: every node; restrict with airm.ai-computing.io/<vendor>.<model> labels
tolerations:
  - operator: Exists   # run on tainted accelerator nodes too
resources: {}
